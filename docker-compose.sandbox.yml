# GERADO por scripts/gen_distrib.py — NÃO editar à mão. Fonte: docker-compose.dokploy.yml
name: agenteos-sandbox
x-restart:
  restart: unless-stopped
x-app-env:
  APP_ENV: ${APP_ENV:-development}
  APP_MODE: ${APP_MODE:-standard}
  DEMO_FIXTURES_ROOT: ${DEMO_FIXTURES_ROOT:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEBUG: ${DEBUG:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SOURCE_REF:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  GLPI_URL: ${GLPI_URL:-}
  GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:-}
  GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:-}
  GLPI_API_USER: ${GLPI_API_USER:-}
  GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
  GLPI_V1_APP_TOKEN: ${GLPI_V1_APP_TOKEN:-}
  GLPI_V1_USER_TOKEN: ${GLPI_V1_USER_TOKEN:-}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-${POSTGRES_USER:-agenteos}}:${POSTGRES_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD:?defina
    POSTGRES_PASSWORD no .env}}@postgres:5432/${POSTGRES_DB:-agenteos}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
  LLM_SECRET_ENC_KEY: ${LLM_SECRET_ENC_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@dataagile.com.br}
  INVITE_LINK_BASE: ${INVITE_LINK_BASE:-http://localhost:8001}
  WEB_BASE_URL: ${WEB_BASE_URL:-${INVITE_LINK_BASE:-}}
x-app-deps:
  db-migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
volumes:
  agent_specs_data: null
  chat_uploads: null
  postgres_data: null
  redis_data: null
  qdrant_data: null
  grafana_data: null
  loki_data: null
  prometheus_data: null
  pgbackrest_repo: null
  minio_data: null
  evolution_data: null
  web_dist: null
  console_web_dist: null
  hatchet_config: null
  hatchet_token: null
services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenteos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-agenteos}
    command: 'postgres -c wal_level=replica -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=200 -c idle_in_transaction_session_timeout=30000
      -c archive_mode=on -c archive_command=/bin/true -c max_connections=200

      '
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infra/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-agenteos} -d ${POSTGRES_DB:-agenteos}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command:
    - redis-server
    - --maxmemory
    - ${REDIS_MAXMEMORY:-256mb}
    - --maxmemory-policy
    - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant
    volumes:
    - qdrant_data:/qdrant/storage
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
  litellm-proxy:
    restart: unless-stopped
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY obrigatório}
      REDIS_URL: ${LITELLM_REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenteos}:${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}@postgres:5432/litellm
      STORE_MODEL_IN_DB: 'True'
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    volumes:
    - ./infra/compose/litellm_config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
        || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  hatchet:
    restart: unless-stopped
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest@sha256:8bcaa78792a3de898d3f906b2f57c73fb3480e46cbeedc08c014fdf53060bba3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agenteos}:${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}@postgres:5432/hatchet?sslmode=disable
      DATABASE_POSTGRES_HOST: postgres
      DATABASE_POSTGRES_PORT: '5432'
      DATABASE_POSTGRES_USERNAME: ${POSTGRES_USER:-agenteos}
      DATABASE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no
        .env}
      DATABASE_POSTGRES_DB_NAME: hatchet
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-localhost}
      SERVER_AUTH_COOKIE_INSECURE: t
      SERVER_AUTH_SET_EMAIL_VERIFIED: t
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: t
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7077
      SERVER_GRPC_PORT: '7077'
      SERVER_URL: http://localhost:8888
      SERVER_DEFAULT_ENGINE_VERSION: V1
      ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:?HATCHET_ADMIN_EMAIL required (admin inicial
        do dashboard Hatchet)}
      ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:?HATCHET_ADMIN_PASSWORD required (admin
        inicial do dashboard Hatchet)}
    volumes:
    - hatchet_config:/config
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8733/live || exit 1
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
    - 127.0.0.1:${SANDBOX_HATCHET_PORT:-8889}:8888
  hatchet-token-init:
    image: python:3.12-slim
    command:
    - python
    - /hatchet_token_init.py
    environment:
      HATCHET_API_URL: http://hatchet:8888
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:-}
      HATCHET_ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:-}
    volumes:
    - ./infra/scripts/hatchet_token_init.py:/hatchet_token_init.py:ro
    - hatchet_token:/run/hatchet
    depends_on:
      hatchet:
        condition: service_healthy
    restart: 'no'
  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:latest
    command:
    - --config=/etc/otel-collector-config.yaml
    volumes:
    - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      loki:
        condition: service_started
  prometheus:
    restart: unless-stopped
    image: prom/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    volumes:
    - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus_data:/prometheus
  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.3
    command:
    - -config.file=/etc/loki/loki-config.yaml
    - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    volumes:
    - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    - loki_data:/loki
  grafana:
    restart: unless-stopped
    image: grafana/grafana-oss
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD
        obrigatório}
    volumes:
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
  node_exporter:
    restart: unless-stopped
    image: prom/node-exporter
  postgres_exporter:
    restart: unless-stopped
    image: quay.io/prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-agenteos}:${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-agenteos}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  redis_exporter:
    restart: unless-stopped
    image: oliver006/redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  pgbackrest:
    restart: unless-stopped
    image: woblerr/pgbackrest:2.53
    entrypoint:
    - sh
    - -c
    - tail -f /dev/null
    volumes:
    - ./infra/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    - pgbackrest_repo:/var/lib/pgbackrest
    - postgres_data:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy
  embeddings:
    restart: unless-stopped
    profiles:
    - retrieval
    environment:
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-m3}
      DEVICE: ${EMBEDDINGS_DEVICE:-cpu}
      PORT: '8001'
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  reranker:
    restart: unless-stopped
    profiles:
    - retrieval
    environment:
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-BAAI/bge-reranker-v2-m3}
      DEVICE: ${RERANKER_DEVICE:-cpu}
      PORT: '8002'
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
        || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  db-migrate:
    image: ${IMAGE_PREFIX:-docker.dataagile.com.br/agenteos/agenteos-}db-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agenteos}:${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-agenteos}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
      AGENT_SPECS_STORE_ROOT: ${AGENT_SPECS_STORE_ROOT:-/var/lib/agenteos/specs}
      AGENT_SPECS_SEED_ROOTS: ${AGENT_SPECS_SEED_ROOTS:-/app/packages/agent-specs:/app/vendor/sandbox-agents}
      SECRET_KEY: ${SECRET_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      APP_MFA_MASTER_KEY: ${APP_MFA_MASTER_KEY:-}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SHORT_LINK_HMAC_SECRET: ${SHORT_LINK_HMAC_SECRET:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      HATCHET_ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    volumes:
    - agent_specs_data:${AGENT_SPECS_STORE_ROOT:-/var/lib/agenteos/specs}
    pull_policy: always
  minio:
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio-init:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    entrypoint:
    - /bin/sh
    - -c
    command:
    - 'mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASS" &&

      mc mb --ignore-existing "local/$$BUCKET_APPS" &&

      mc mb --ignore-existing "local/$$BUCKET_EVAL"

      '
    environment:
      MC_USER: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      MC_PASS: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      BUCKET_APPS: ${STORAGE_BUCKET:-agenteos}
      BUCKET_EVAL: ${OBJECT_STORAGE_BUCKET:-roi-reports}
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: '500'
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    volumes:
    - /tmp/mailpit:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8025/livez || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
  evolution-api:
    restart: unless-stopped
    image: evoapicloud/evolution-api:v2.2.3
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://evolution-api:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-agenteos}:${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: agenteos
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://channels:8000/webhook/whatsapp/evolution}
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      DEL_INSTANCE: 'false'
      CONFIG_SESSION_PHONE_CLIENT: AgenteOS
      LOG_LEVEL: ERROR
    volumes:
    - evolution_data:/evolution/instances
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8080/ || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
    - channels
  api-gateway:
    restart: unless-stopped
    image: ${IMAGE_PREFIX:-docker.dataagile.com.br/agenteos/agenteos-}api-gateway:${IMAGE_TAG:-latest}
    command:
    - sh
    - -c
    - export HATCHET_CLIENT_TOKEN="$${HATCHET_CLIENT_TOKEN:-$$(cat /run/hatchet/token
      2>/dev/null)}"; exec uv run --package api-gateway uvicorn api_gateway.main:get_app
      --factory --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_MODE: ${APP_MODE:-standard}
      DEMO_FIXTURES_ROOT: ${DEMO_FIXTURES_ROOT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SOURCE_REF:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      GLPI_URL: ${GLPI_URL:-}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:-}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:-}
      GLPI_API_USER: ${GLPI_API_USER:-}
      GLPI_API_PASSWORD: ${GLPI_API_PASSWORD:-}
      GLPI_V1_APP_TOKEN: ${GLPI_V1_APP_TOKEN:-}
      GLPI_V1_USER_TOKEN: ${GLPI_V1_USER_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-${POSTGRES_USER:-agenteos}}:${POSTGRES_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD:?defina
        POSTGRES_PASSWORD no .env}}@postgres:5432/${POSTGRES_DB:-agenteos}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatório}
      LLM_SECRET_ENC_KEY: ${LLM_SECRET_ENC_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@dataagile.com.br}
      INVITE_LINK_BASE: ${INVITE_LINK_BASE:?INVITE_LINK_BASE required (e.g. https://yourdomain)}
      WEB_BASE_URL: ${WEB_BASE_URL:-${INVITE_LINK_BASE:-}}
      OTEL_SERVICE_NAME: api-gateway
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      CHAT_JOB_URL_ALLOWED_HOSTS: ${CHAT_JOB_URL_ALLOWED_HOSTS:-}
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_CLIENT_HOST_PORT: hatchet:7077
      HATCHET_CLIENT_SERVER_URL: http://hatchet:8888
      APP_MFA_MASTER_KEY: ${APP_MFA_MASTER_KEY:?APP_MFA_MASTER_KEY required}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET:?JWT_INTERNAL_SECRET required}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN required}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET required}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-}
      OAUTH_APP_GOOGLE_CLIENT_ID: ${OAUTH_APP_GOOGLE_CLIENT_ID:-}
      OAUTH_APP_GOOGLE_CLIENT_SECRET: ${OAUTH_APP_GOOGLE_CLIENT_SECRET:-}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      DATA_PLANE_SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      DATA_PLANE_URL: ${DATA_PLANE_URL:-http://data-plane:8000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm-proxy:4000}
      MCP_ADMIN_URL: ${MCP_ADMIN_URL:-http://mcp-server:8000}
      MCP_ADMIN_KEY: ${MCP_ADMIN_KEY:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_ADMIN_TENANT_ID: ${MCP_ADMIN_TENANT_ID:-}
      CHANNELS_URL: ${CHANNELS_URL:-http://channels:8000}
      CHANNELS_SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      CHANNEL_WEBHOOK_BASE_URL: ${CHANNEL_WEBHOOK_BASE_URL:-}
      SELF_SERVICE_CONTRACTS: ${SELF_SERVICE_CONTRACTS:-false}
      CHAT_TOOLS_ENABLED: ${CHAT_TOOLS_ENABLED:-true}
      CHAT_TOOLS_MAX_ROUNDS: ${CHAT_TOOLS_MAX_ROUNDS:-4}
      CHAT_TOOLS_TIMEOUT_S: ${CHAT_TOOLS_TIMEOUT_S:-20.0}
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_ALLOWED_TENANT_IDS: ${MCP_ALLOWED_TENANT_IDS:-[]}
      AGENT_SPECS_STORE_ROOT: ${AGENT_SPECS_STORE_ROOT:-/var/lib/agenteos/specs}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hatchet-token-init:
        condition: service_completed_successfully
        required: false
    volumes:
    - hatchet_token:/run/hatchet:ro
    - agent_specs_data:${AGENT_SPECS_STORE_ROOT:-/var/lib/agenteos/specs}
    - chat_uploads:${CHAT_UPLOADS_DIR:-/data/chat-uploads}
    pull_policy: always
  mcp-server:
    restart: unless-stopped
    image: ${IMAGE_PREFIX:-docker.dataagile.com.br/agenteos/agenteos-}mcp-server:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_MODE: ${APP_MODE:-standard}
      DEMO_FIXTURES_ROOT: ${DEMO_FIXTURES_ROOT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SOURCE_REF:-}
