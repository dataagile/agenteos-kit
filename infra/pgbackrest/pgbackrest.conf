# pgBackRest configuration — AgenteOS (E01 §7.8 / D25)
#
# Stanza: agenteos
# Repositório: posix/filesystem (volume Docker pgbackrest_repo)
# RPO target : 1h  (WAL archiving contínuo)
# RTO target : 4h  (restore + replay)
#
# COMO APLICAR ao stack Docker Compose
# ─────────────────────────────────────
# 1. O serviço `pgbackrest` monta este arquivo em /etc/pgbackrest/pgbackrest.conf
#    (read-only) e o volume `pgbackrest_repo` em /var/lib/pgbackrest.
# 2. O Postgres (postgres:16) deve substituir o placeholder `archive_command=/bin/true`
#    pelo comando real abaixo. Nos compose files isso é feito em docker-compose.prod.yml
#    acrescentando o argumento ao `command:`:
#
#      -c archive_command='pgbackrest --stanza=agenteos --config=/etc/pgbackrest/pgbackrest.conf archive-push %p'
#
#    O serviço pgbackrest deve compartilhar:
#      • o volume pgbackrest_repo   → /var/lib/pgbackrest
#      • o volume postgres_data     → /var/lib/postgresql/data (read-only)
#      • o socket Unix do Postgres  → /var/run/postgresql (para pg_basebackup)
#    OU comunicar-se via TCP com usuário dedicado (ver README.md).
#
# 3. Para stanza-create (executar UMA vez após o primeiro `docker compose up`):
#      docker exec pgbackrest pgbackrest --stanza=agenteos stanza-create
#
# 4. Verificar archive (confirmar que WAL está chegando):
#      docker exec pgbackrest pgbackrest --stanza=agenteos check
#
# ─────────────────────────────────────────────────────────────────────────────

[global]
# Repositório 1: filesystem local (posix). Volume Docker persistente.
repo1-type=posix
repo1-path=/var/lib/pgbackrest

# Retenção: manter 7 backups full diários (~1 semana).
# Backups incrementais são retidos junto com o full que os ancora.
repo1-retention-full=7
repo1-retention-full-type=count

# Compressão: lz4 — melhor trade-off velocidade/ratio para restore rápido (RTO 4h).
compress-type=lz4
compress-level=1

# Logging: arquivo + stderr para visibilidade nos logs do container.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Process parallelism: 2 cores para não saturar o VPS durante backup.
process-max=2

# Checksum para integridade de bloco.
checksum-page=y

# Delta restore: restaura apenas páginas alteradas (mais rápido em restore incremental).
delta=y

# ─────────────────────────────────────────────────────────────────────────────
[agenteos]
# Host/porta do Postgres dentro da rede Docker.
# pgBackRest acessa via psql para controle de WAL (pg_switch_wal, pg_start_backup).
pg1-host=postgres
pg1-host-port=5432
pg1-host-user=agenteos
pg1-path=/var/lib/postgresql/data

# Porta local (quando pgbackrest roda no mesmo container que o Postgres —
# modo alternativo sem pg1-host; descomentar e comentar pg1-host se necessário).
# pg1-port=5432
# pg1-user=agenteos
# pg1-path=/var/lib/postgresql/data

# Database de controle (para conexão psql).
pg1-database=agenteos

# ─────────────────────────────────────────────────────────────────────────────
# archive_command para o postgresql.conf / docker-compose command:
# (este arquivo documenta o valor — a aplicação é no compose)
#
#   archive_command = 'pgbackrest --stanza=agenteos --config=/etc/pgbackrest/pgbackrest.conf archive-push %p'
#
# Substitui o placeholder `-c archive_command=/bin/true` do docker-compose.base.yml.
# archive_mode=on já está configurado no base compose.
# ─────────────────────────────────────────────────────────────────────────────
