# Grafana dashboards provisioning — E01 §5.4
# Provider aponta para /var/lib/grafana/dashboards (montado de infra/grafana/dashboards/).
# Modo provisioning: dashboards são read-only via UI; mudanças vão pelo Git (R7).

apiVersion: 1

providers:
  - name: "AgenteOS"
    orgId: 1
    folder: "AgenteOS"
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
