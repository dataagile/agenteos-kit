# Nginx — spoke variant (single-tenant contract stack, no admin console).
# Copy of nginx.npm.conf with the admin server block / 10-admin.conf include
# removed: the spoke has no platform-console/console-web services (the admin
# console lives only on the hub — see spec/plataforma/vps-per-contrato-v1.md).
# TLS terminates at NPM/Cloudflare; here only HTTP :80, no certbot, no redirect.
# Serves the SPA (web_dist) and proxies /api/ → api-gateway (single HTTP entry, D-A).
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 50m;  # uploads de Conhecimento (E07/E10)

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Preservar scheme original quando atrás de proxy (NPM/Cloudflare). Sem isso,
    # FastAPI gera redirects http:// (mixed content blocking + Authorization perdido).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    log_format json escape=json
        '{"ts":"$time_iso8601","service":"nginx","request_id":"$req_id",'
        '"method":"$request_method","path":"$uri","status_code":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr"}';
    access_log /var/log/nginx/access.log json;

    # Docker embedded DNS — re-resolve a cada 10s. Sem isto, o IP do
    # api-gateway fica cacheado no boot do nginx; qualquer `docker compose up
    # --force-recreate api-gateway` muda o IP e este nginx começa a devolver
    # 502 "Host is unreachable" até ser reloadado manualmente.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Security headers (R12 / OWASP hardening). CSP deferred — requires per-route audit.
        # HSTS omitted here: TLS terminates at NPM/Cloudflare, not at this server.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # API → api-gateway (com suporte a WebSocket p/ runs/knowledge live).
        # Variável força o nginx a re-resolver via `resolver` em runtime
        # (não cacheia no parse de config).
        location /api/ {
            set $api_upstream "api-gateway";
            proxy_pass http://$api_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $req_id;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            # Rewrite Location header http:// → https:// pra evitar mixed-content
            # quando FastAPI gera trailing-slash redirect com scheme do upstream.
            proxy_redirect ~^http://([^/]+)/(.*)$ https://$1/$2;
        }

        # No admin console on the spoke — no /config.json route. apps/web's
        # ShellLayout fetch("/config.json") degrades gracefully on a plain
        # 404 (fallback text, no admin link) — see ShellLayout.test.tsx.

        # Webhooks externos (Telegram, WhatsApp, e-mail inbound) → apps/channels.
        # Providers externos batem aqui via URL pública; verificação HMAC/secret
        # acontece no service (não aqui).
        location /webhook/ {
            set $ch_upstream "channels";
            proxy_pass http://$ch_upstream:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $req_id;
            # HTTP/1.1 + keepalive: sob burst (rate-limit unblock, coalesce
            # de mensagens do mesmo usuário) evita handshake TCP por request
            # e acúmulo de TIME_WAIT no channels app.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Timeouts curtos: Telegram/Meta esperam 2xx em segundos, não
            # minutos. Reduz janela em que redeploy silencia webhook.
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            # Retry idempotente em erro/timeout: durante reinício do
            # container o resolver re-descobre o IP (resolver 10s), mas
            # requests em voo caem em 502. next_upstream + tries reduz o
            # blast radius para 1-2 requests ao invés de todas até o
            # provider parar de retriar.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
            proxy_redirect ~^http://([^/]+)/(.*)$ https://$1/$2;
        }

        # SPA estática.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # No admin server block on the spoke — the admin console (platform-console
    # + console-web) lives only on the hub. nginx.npm.conf's `include
    # /etc/nginx/conf.d/10-admin.conf` (server_name ${ADMIN_SERVER_NAME},
    # proxying to platform-console and serving console_web_dist) is
    # intentionally NOT included here — those services and that volume don't
    # exist in docker-compose.spoke.yml.
}
